name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the project is developed on; 3.12 catches anything that
        # only breaks on a newer runtime.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        # Both files: the root one is the standalone CLI (matplotlib), the
        # backend one is the web app (fastapi/uvicorn/httpx). The WebSocket
        # tests need the second, so installing only the first fails at import.
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt

      - name: Run tests
        env:
          # plotting.py / plot_results.py import matplotlib; there is no display.
          MPLBACKEND: Agg
        run: python -m pytest tests/ -v --tb=short
